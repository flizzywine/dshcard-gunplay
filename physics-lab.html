<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>物理试验场 · Gunplay</title>
  <script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#121b23;color:#edf6f6;font:15px/1.7 system-ui,sans-serif;overflow:hidden}canvas{display:block}
    header{position:fixed;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}
    h1{font-size:25px;line-height:1.3;margin:4px 0 12px;font-weight:650}small{color:#75d6cf;font-size:11px;letter-spacing:3px}nav{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
    button,a{font:inherit;color:inherit;background:#1d2b35df;border:1px solid #52616a;border-radius:7px;padding:7px 14px;text-decoration:none;cursor:pointer}button:hover,button[aria-pressed=true]{border-color:#75d6cf;background:#254947}a{pointer-events:auto}
    footer{position:fixed;bottom:24px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:end;gap:20px;pointer-events:none}
    .panel{background:#14212ae8;border:1px solid #43535d;border-radius:9px;padding:14px 18px;backdrop-filter:blur(10px)}#status{color:#82e2d6}#hint{font-size:13px;color:#c7d2d7}b{color:white;font-weight:600}
    @media(max-width:700px){header{left:14px;top:14px;right:14px}footer{left:14px;bottom:14px;right:14px;display:block}.panel{margin-top:8px}h1{font-size:19px}button{padding:5px 8px}}
  </style>
</head>
<body>
  <header><div><small>GUNPLAY / RAPIER 3D</small><h1>物理试验场</h1><nav aria-label="测试场景">
    <button data-scenario="ramp">坡面移动</button><button data-scenario="stairs">台阶攀爬</button><button data-scenario="tunnel">低洞与趴下</button><button data-scenario="wall">薄墙与突进</button>
  </nav></div><a href="./">返回游戏</a></header>
  <footer><div class="panel"><div><b>WASD</b> 移动　<b>空格</b> 跳跃　<b>Shift</b> 突进</div><div><b>C</b> 蹲伏　<b>Z</b> 趴下 / 起身　<b>E</b> 投掷球　<b>R</b> 重置</div><div id="hint">正在初始化物理引擎…</div></div><div class="panel" id="status" role="status">加载中</div></footer>
  <script type="module" src="./js/physics-lab.js"></script>
</body>
</html>
